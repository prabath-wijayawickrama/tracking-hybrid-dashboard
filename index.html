<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hybrid Tracking → Warehouse Intelligence</title>

  <link rel="stylesheet" href="css/style.css" />

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
</head>

<body class="desktop">

  <div class="card">

    <div class="top-bar">
      <div>
        <h1>Hybrid Tracking → Warehouse</h1>
        <p>Upload a CSV (TrackingID, Merchant, Warehouse). The hybrid engine learns patterns and predicts the warehouse with a confidence score.</p>
      </div>

      <div class="top-actions">
        <button id="themeToggleBtn">Dark Mode</button>
        <button id="viewToggleBtn">Mobile View</button>
      </div>
    </div>

    <div id="trainingProgressContainer" class="hidden">
      <div class="progress-label">Learning model…</div>
      <div class="progress-bar">
        <div id="trainingProgressBar">0%</div>
      </div>
    </div>

    <div class="scan-summary">
      <div class="scan-box">
        <div class="scan-label">BER3</div>
        <div class="scan-value" id="berCount">0</div>
      </div>
      <div class="scan-box">
        <div class="scan-label">POZ</div>
        <div class="scan-value" id="pozCount">0</div>
      </div>
      <div class="scan-box">
        <div class="scan-label">Total</div>
        <div class="scan-value" id="totalCount">0</div>
      </div>
    </div>

    <div class="section-title">Warehouse Summary (Session)</div>
    <div id="warehouseSummary" class="warehouse-summary">
      <div class="placeholder">No scans yet.</div>
    </div>

    <div class="merchant-summary">
      <div class="merchant-summary-header">
        <div>Merchant</div>
        <div class="right">Count</div>
        <div class="right">%</div>
      </div>
      <div id="merchantSummaryBody">
        <div class="placeholder">No scans yet.</div>
      </div>
    </div>

    <label for="csvFile">Upload CSV</label>
    <input type="file" id="csvFile" accept=".csv" />

    <label for="returnIdInput">Tracking ID</label>
    <input type="text" id="returnIdInput" placeholder="Enter Tracking ID…" />

    <button id="lookupBtn" disabled>Predict Warehouse</button>

    <div id="result" class="result hidden"></div>

  </div>

  <!-- JS Modules -->
  <script src="js/utils.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/ngram.js"></script>
  <script src="js/markov.js"></script>
  <script src="js/ml.js"></script>
  <script src="js/lstm.js"></script>
  <script src="js/hybrid.js"></script>
  <script src="js/summary.js"></script>
  <script src="js/result.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
