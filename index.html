<body class="desktop">
  <div class="card">
    <div class="top-bar">
      <div>
        <h1>Hybrid Tracking → Warehouse</h1>
        <p>Upload a CSV (TrackingID, Merchant, Warehouse). The hybrid engine learns patterns and predicts the warehouse with a confidence score.</p>
      </div>
      <div class="top-actions">
        <button id="themeToggleBtn" type="button">Dark Mode</button>

      <div style="font-family:'Syne'; font-size:13px; font-weight:600; margin-bottom:4px;">Learning model…</div>

      </div>
    </div>

    <div class="scan-summary">
      <div class="scan-box">
        <div class="scan-label">BER3</div>
        <div class="scan-value" id="berCount">0</div>
      </div>
      <div class="scan-box">
        <div class="scan-label">POZ</div>
        <div class="scan-value" id="pozCount">0</div>

    </div>

    <div class="section-title">Warehouse Summary (Session)</div>

    </div>

    <input type="file" id="csvFile" accept=".csv" />

<script>
// -------------------------------
// THEME TOGGLE (Light / Dark Mode)
// -------------------------------
document.getElementById("themeToggleBtn").addEventListener("click", () => {
  document.body.classList.toggle("dark");
});

// -------------------------------
// VIEW TOGGLE (Desktop / Mobile)
// -------------------------------
document.getElementById("viewToggleBtn").addEventListener("click", () => {
  document.body.classList.toggle("mobile");
});

// -------------------------------
// GLOBAL STATE OBJECTS
// -------------------------------
let mapping = {};              // Raw CSV data
let learnedPatterns = {};      // Prefix → Warehouse
let knownPrefixes = [];        // List of prefixes

let berCount = 0;
let pozCount = 0;
let totalCount = 0;

let warehouseCounts = {};      // Session warehouse stats
let merchantCounts = {};       // Session merchant stats

let nGramStats = {};           // N‑gram frequency model
let markovStats = {};          // Markov chain transitions
let mlStats = {};              // Simple ML heuristics

let charSet = new Set();       // Characters for LSTM
let warehouseIndex = {};       // Warehouse → index
let indexWarehouse = {};       // index → Warehouse
let lstmModel = null;          // TensorFlow.js model
let maxSeqLen = 20;            // Max sequence length

// -------------------------------
// CSV UPLOAD HANDLER
// -------------------------------
document.getElementById("csvFile").addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = async (e) => {
    const text = e.target.result;

    // Parse CSV
    mapping = parseCsv(text);

    // Learn prefix patterns
    learnedPatterns = learnPatterns(mapping);
    knownPrefixes = Object.keys(learnedPatterns);

    // Build statistical models
    buildNGramStats(mapping);
    buildMarkovStats(mapping);
    buildMLStats(mapping);
    buildCharSetAndWarehouseIndex(mapping);

    // Train LSTM model
    await trainLstmModel(mapping);

    // Enable prediction button
    document.getElementById("lookupBtn").disabled = false;

    showMessage("CSV loaded. Hybrid engine trained.");
  };

  reader.readAsText(file);
});

// -------------------------------
// LOOKUP BUTTON HANDLER
// -------------------------------
document.getElementById("lookupBtn").addEventListener("click", async () => {
  const id = document.getElementById("returnIdInput").value.trim();
  if (!id) return;

  const merchant = getMerchantForId(id);
  const result = await hybridPredict(id);

  updateCounters(result.warehouse, merchant);
  showHybridResult(result.warehouse, result.confidence, result.layerDetails);
});
</script>
<script>
// -------------------------------------------------------
// MODULE 3 — CSV PARSER + PATTERN LEARNING + STAT MODELS
// -------------------------------------------------------

// -------------------------------
// CSV PARSER
// -------------------------------
function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const map = {};

  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(",");
    if (parts.length < 3) continue;

    const id = parts[0].trim();
    const merchant = parts[1].trim();
    const warehouse = parts[2].trim();

    map[id] = { merchant, warehouse };
  }

  return map;
}

// -------------------------------
// PREFIX PATTERN LEARNING
// -------------------------------
function learnPatterns(map) {
  const patterns = {};

  Object.entries(map).forEach(([id, info]) => {
    const wh = info.warehouse;

    // Extract prefix (letters, #, -)
    const prefix = id.match(/^[A-Za-z#-]+/)?.[0];
    if (!prefix) return;

    if (!patterns[prefix]) patterns[prefix] = {};
    patterns[prefix][wh] = (patterns[prefix][wh] || 0) + 1;
  });

  // Convert counts → dominant warehouse
  const output = {};
  Object.entries(patterns).forEach(([prefix, whCounts]) => {
    const best = Object.entries(whCounts).sort((a, b) => b[1] - a[1])[0][0];
    output[prefix] = best;
  });

  return output;
}

// -------------------------------
// N‑GRAM MODEL (3‑grams)
// -------------------------------
function buildNGramStats(map) {
  nGramStats = {};
  const n = 3;

  Object.entries(map).forEach(([id, info]) => {
    const wh = info.warehouse;
    if (!nGramStats[wh]) nGramStats[wh] = {};

    for (let i = 0; i <= id.length - n; i++) {
      const gram = id.slice(i, i + n);
      nGramStats[wh][gram] = (nGramStats[wh][gram] || 0) + 1;
    }
  });
}

// -------------------------------
// MARKOV CHAIN MODEL
// -------------------------------
function buildMarkovStats(map) {
  markovStats = {};

  Object.entries(map).forEach(([id, info]) => {
    const wh = info.warehouse;
    if (!markovStats[wh]) markovStats[wh] = {};

    for (let i = 0; i < id.length - 1; i++) {
      const a = id[i];
      const b = id[i + 1];

      if (!markovStats[wh][a]) markovStats[wh][a] = {};
      markovStats[wh][a][b] = (markovStats[wh][a][b] || 0) + 1;
    }
  });
}

// -------------------------------
// SIMPLE ML HEURISTICS
// -------------------------------
function buildMLStats(map) {
  mlStats = {};

  Object.entries(map).forEach(([id, info]) => {
    const wh = info.warehouse;

    if (!mlStats[wh]) {
      mlStats[wh] = { len: 0, digits: 0, letters: 0, count: 0 };
    }

    mlStats[wh].len += id.length;
    mlStats[wh].digits += (id.match(/\d/g) || []).length;
    mlStats[wh].letters += (id.match(/[A-Za-z]/g) || []).length;
    mlStats[wh].count++;
  });
}

// -------------------------------
// CHARACTER SET + WAREHOUSE INDEX
// -------------------------------
function buildCharSetAndWarehouseIndex(map) {
  charSet = new Set();
  warehouseIndex = {};
  indexWarehouse = {};

  let idx = 0;

  Object.entries(map).forEach(([id, info]) => {
    for (const c of id) charSet.add(c);

    const wh = info.warehouse;
    if (!(wh in warehouseIndex)) {
      warehouseIndex[wh] = idx;
      indexWarehouse[idx] = wh;
      idx++;
    }
  });

  // Cap sequence length to 20 for LSTM
  maxSeqLen = Math.min(
    Math.max(...Object.keys(map).map(k => k.length)),
    20
  );
}
</script>
<script>
// -------------------------------------------------------
// MODULE 4 — SIMILARITY MODELS + HYBRID SCORING ENGINE
// -------------------------------------------------------

// -------------------------------
// PREFIX MATCH SCORE
// -------------------------------
function prefixScore(id) {
  for (const prefix of knownPrefixes) {
    if (id.startsWith(prefix)) {
      return { warehouse: learnedPatterns[prefix], score: 1.0 };
    }
  }
  return { warehouse: null, score: 0 };
}

// -------------------------------
// N‑GRAM SIMILARITY SCORE
// -------------------------------
function nGramScore(id) {
  const n = 3;
  const scores = {};

  for (const [wh, grams] of Object.entries(nGramStats)) {
    let score = 0;

    for (let i = 0; i <= id.length - n; i++) {
      const gram = id.slice(i, i + n);
      if (grams[gram]) score += grams[gram];
    }

    scores[wh] = score;
  }

  const bestWh = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
  return { warehouse: bestWh[0], score: bestWh[1] };
}

// -------------------------------
// MARKOV CHAIN SCORE
// -------------------------------
function markovScore(id) {
  const scores = {};

  for (const [wh, transitions] of Object.entries(markovStats)) {
    let score = 0;

    for (let i = 0; i < id.length - 1; i++) {
      const a = id[i];
      const b = id[i + 1];

      if (transitions[a] && transitions[a][b]) {
        score += transitions[a][b];
      }
    }

    scores[wh] = score;
  }

  const bestWh = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
  return { warehouse: bestWh[0], score: bestWh[1] };
}

// -------------------------------
// SIMPLE ML HEURISTIC SCORE
// -------------------------------
function mlHeuristicScore(id) {
  const scores = {};

  Object.entries(mlStats).forEach(([wh, stats]) => {
    const avgLen = stats.len / stats.count;
    const avgDigits = stats.digits / stats.count;
    const avgLetters = stats.letters / stats.count;

    const lenDiff = Math.abs(id.length - avgLen);
    const digitDiff = Math.abs((id.match(/\d/g) || []).length - avgDigits);
    const letterDiff = Math.abs((id.match(/[A-Za-z]/g) || []).length - avgLetters);

    const score = -(lenDiff + digitDiff + letterDiff);
    scores[wh] = score;
  });

  const bestWh = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
  return { warehouse: bestWh[0], score: bestWh[1] };
}

// -------------------------------
// HYBRID SCORE COMBINER
// -------------------------------
function combineScores(prefix, ngram, markov, ml, lstm) {
  const weights = {
    prefix: 1.2,
    ngram: 1.0,
    markov: 1.0,
    ml: 0.6,
    lstm: 2.0
  };

  const scoreMap = {};

  function addScore(wh, score, weight) {
    if (!scoreMap[wh]) scoreMap[wh] = 0;
    scoreMap[wh] += score * weight;
  }

  if (prefix.warehouse) addScore(prefix.warehouse, prefix.score, weights.prefix);
  addScore(ngram.warehouse, ngram.score, weights.ngram);
  addScore(markov.warehouse, markov.score, weights.markov);
  addScore(ml.warehouse, ml.score, weights.ml);
  addScore(lstm.warehouse, lstm.score, weights.lstm);

  const best = Object.entries(scoreMap).sort((a, b) => b[1] - a[1])[0];
  const total = Object.values(scoreMap).reduce((a, b) => a + b, 0);

  const confidence = total > 0 ? (best[1] / total) : 0;

  return {
    warehouse: best[0],
    confidence,
    layerDetails: {
      prefix,
      ngram,
      markov,
      ml,
      lstm
    }
  };
}
</script>
<script>
// -------------------------------------------------------
// MODULE 5 — LSTM MODEL (BUILD + TRAIN + PREDICT)
// -------------------------------------------------------

// -------------------------------
// CHARACTER → INDEX ENCODING
// -------------------------------
function encodeChar(c) {
  return [...charSet].indexOf(c);
}

function encodeSequence(id) {
  const chars = [...charSet];
  const seq = Array(maxSeqLen).fill(0);

  const trimmed = id.slice(-maxSeqLen);
  const offset = maxSeqLen - trimmed.length;

  for (let i = 0; i < trimmed.length; i++) {
    seq[offset + i] = chars.indexOf(trimmed[i]);
  }

  return seq;
}

// -------------------------------
// BUILD LSTM MODEL
// -------------------------------
function buildLstmModel() {
  const chars = [...charSet];
  const numChars = chars.length;
  const numWarehouses = Object.keys(warehouseIndex).length;

  const model = tf.sequential();

  model.add(tf.layers.embedding({
    inputDim: numChars,
    outputDim: 16,
    inputLength: maxSeqLen
  }));

  model.add(tf.layers.lstm({
    units: 32,
    returnSequences: false
  }));

  model.add(tf.layers.dense({
    units: numWarehouses,
    activation: "softmax"
  }));

  model.compile({
    optimizer: tf.train.adam(0.005),
    loss: "sparseCategoricalCrossentropy",
    metrics: ["accuracy"]
  });

  return model;
}

// -------------------------------
// TRAIN LSTM MODEL
// -------------------------------
async function trainLstmModel(map) {
  const ids = Object.keys(map);
  const chars = [...charSet];

  const xs = [];
  const ys = [];

  ids.forEach(id => {
    xs.push(encodeSequence(id));
    ys.push(warehouseIndex[map[id].warehouse]);
  });

  const xTensor = tf.tensor2d(xs, [xs.length, maxSeqLen]);
  const yTensor = tf.tensor1d(ys, "int32");

  lstmModel = buildLstmModel();

  document.getElementById("trainingProgressContainer").style.display = "block";

  await lstmModel.fit(xTensor, yTensor, {
    epochs: 8,
    batchSize: 32,
    shuffle: true,
    callbacks: {
      onEpochEnd: (epoch, logs) => {
        const pct = Math.round(((epoch + 1) / 8) * 100);
        const bar = document.getElementById("trainingProgressBar");
        bar.style.width = pct + "%";
        bar.textContent = pct + "%";
      }
    }
  });

  document.getElementById("trainingProgressContainer").style.display = "none";

  xTensor.dispose();
  yTensor.dispose();
}

// -------------------------------
// LSTM PREDICT
// -------------------------------
async function lstmPredict(id) {
  if (!lstmModel) {
    return { warehouse: null, score: 0 };
  }

  const seq = encodeSequence(id);
  const input = tf.tensor2d([seq], [1, maxSeqLen]);

  const pred = lstmModel.predict(input);
  const data = await pred.data();

  input.dispose();
  pred.dispose();

  let bestIndex = 0;
  let bestScore = 0;

  for (let i = 0; i < data.length; i++) {
    if (data[i] > bestScore) {
      bestScore = data[i];
      bestIndex = i;
    }
  }

  return {
    warehouse: indexWarehouse[bestIndex],
    score: bestScore
  };
}
</script>
<script>
// -------------------------------------------------------
// MODULE 6 — HYBRID PREDICTION ENGINE
// -------------------------------------------------------

// -------------------------------
// GET MERCHANT FOR ID
// -------------------------------
function getMerchantForId(id) {
  return mapping[id]?.merchant || "Unknown";
}

// -------------------------------
// HYBRID PREDICT
// -------------------------------
async function hybridPredict(id) {
  // 1. Prefix model
  const prefix = prefixScore(id);

  // 2. N‑gram model
  const ngram = nGramScore(id);

  // 3. Markov chain model
  const markov = markovScore(id);

  // 4. ML heuristic model
  const ml = mlHeuristicScore(id);

  // 5. LSTM neural model
  const lstm = await lstmPredict(id);

  // Combine all layers
  return combineScores(prefix, ngram, markov, ml, lstm);
}
</script>
<script>
// -------------------------------------------------------
// MODULE 7 — SESSION COUNTERS + SUMMARY RENDERERS
// -------------------------------------------------------

// -------------------------------
// UPDATE COUNTERS AFTER PREDICTION
// -------------------------------
function updateCounters(wh, merchant) {
  totalCount++;

  if (wh.includes("BER3")) berCount++;
  if (wh.includes("POZ")) pozCount++;

  warehouseCounts[wh] = (warehouseCounts[wh] || 0) + 1;
  merchantCounts[merchant] = (merchantCounts[merchant] || 0) + 1;

  document.getElementById("berCount").textContent = berCount;
  document.getElementById("pozCount").textContent = pozCount;
  document.getElementById("totalCount").textContent = totalCount;

  renderWarehouseSummary();
  renderMerchantSummary();
}

// -------------------------------
// RENDER WAREHOUSE SUMMARY
// -------------------------------
function renderWarehouseSummary() {
  const container = document.getElementById("warehouseSummary");
  container.innerHTML = "";

  const entries = Object.entries(warehouseCounts);
  if (entries.length === 0) {
    container.innerHTML = `<div style="font-size:12px; color:var(--subtext);">No scans yet.</div>`;
    return;
  }

  const total = entries.reduce((a, b) => a + b[1], 0);

  entries
    .sort((a, b) => b[1] - a[1])
    .forEach(([wh, count]) => {
      const pct = ((count / total) * 100).toFixed(1);

      const row = document.createElement("div");
      row.className = "warehouse-row";

      row.innerHTML = `
        <div class="warehouse-label">${wh}</div>
        <div class="warehouse-bar">
          <div class="warehouse-bar-fill" style="width:${pct}%">${pct}%</div>
        </div>
        <div class="warehouse-count">${count}</div>
      `;

      container.appendChild(row);
    });
}

// -------------------------------
// RENDER MERCHANT SUMMARY
// -------------------------------
function renderMerchantSummary() {
  const container = document.getElementById("merchantSummaryBody");
  container.innerHTML = "";

  const entries = Object.entries(merchantCounts);
  if (entries.length === 0) {
    container.innerHTML = `<div style="font-size:12px; color:var(--subtext);">No scans yet.</div>`;
    return;
  }

  const total = entries.reduce((a, b) => a + b[1], 0);

  entries
    .sort((a, b) => b[1] - a[1])
    .forEach(([merchant, count]) => {
      const pct = ((count / total) * 100).toFixed(1);

      const row = document.createElement("div");
      row.className = "merchant-row";

      row.innerHTML = `
        <div>${merchant}</div>
        <div style="text-align:right;">${count}</div>
        <div style="text-align:right;">${pct}%</div>
      `;

      container.appendChild(row);
    });
}
</script>
<script>
// -------------------------------------------------------
// MODULE 8 — RESULT PANEL + CONFIDENCE BAR + LAYER DETAILS
// -------------------------------------------------------

// -------------------------------
// SHOW RESULT PANEL
// -------------------------------
function showHybridResult(warehouse, confidence, layers) {
  const resultBox = document.getElementById("result");
  resultBox.style.display = "block";

  const confPct = Math.round(confidence * 100);

  const badgeClass =
    confPct >= 85 ? "conf-high" :
    confPct >= 60 ? "conf-mid" :
    confPct >= 35 ? "conf-low" :
    "conf-verylow";

  resultBox.innerHTML = `
    <div class="prediction-header">
      <div class="prediction-title">Predicted Warehouse: ${warehouse}</div>
      <div class="confidence-badge ${badgeClass}">${confPct}%</div>
    </div>

    <div class="confidence-bar-container">
      <div class="confidence-bar-fill" style="width:${confPct}%;">
        ${confPct}%
      </div>
    </div>

    <div style="margin-top:1rem; font-family:'Syne'; font-size:14px; font-weight:600;">
      Layer Breakdown
    </div>

    <div style="font-size:12px; margin-top:0.5rem;">
      <strong>Prefix Model:</strong> ${layers.prefix.warehouse || "None"}  
      <br>
      <strong>N‑gram Model:</strong> ${layers.ngram.warehouse} (score: ${layers.ngram.score})
      <br>
      <strong>Markov Model:</strong> ${layers.markov.warehouse} (score: ${layers.markov.score})
      <br>
      <strong>ML Heuristic:</strong> ${layers.ml.warehouse} (score: ${layers.ml.score.toFixed(2)})
      <br>
      <strong>LSTM Neural:</strong> ${layers.lstm.warehouse} (score: ${layers.lstm.score.toFixed(3)})
    </div>
  `;
}

// -------------------------------
// SIMPLE MESSAGE DISPLAY
// -------------------------------
function showMessage(msg) {
  const box = document.getElementById("result");
  box.style.display = "block";
  box.innerHTML = msg;
}
</script>
<script>
// -------------------------------------------------------
// MODULE 9 — UTILITY HELPERS + SAFE FALLBACKS
// -------------------------------------------------------

// -------------------------------
// SANITIZE TRACKING ID INPUT
// -------------------------------
function sanitizeId(id) {
  return id.replace(/[^A-Za-z0-9#-]/g, "").trim();
}

// -------------------------------
// SAFE GET: RETURN 0 IF NaN
// -------------------------------
function safeNum(n) {
  return isNaN(n) ? 0 : n;
}

// -------------------------------
// NORMALIZE SCORE MAP
// -------------------------------
function normalizeScores(scoreMap) {
  const total = Object.values(scoreMap).reduce((a, b) => a + b, 0);
  if (total === 0) return scoreMap;

  const normalized = {};
  for (const [k, v] of Object.entries(scoreMap)) {
    normalized[k] = v / total;
  }
  return normalized;
}

// -------------------------------
// RESET RESULT PANEL
// -------------------------------
function clearResult() {
  const box = document.getElementById("result");
  box.style.display = "none";
  box.innerHTML = "";
}

// -------------------------------
// CLEAR INPUT FIELD ON FOCUS
// -------------------------------
document.getElementById("returnIdInput").addEventListener("focus", () => {
  clearResult();
});

// -------------------------------
// SIMPLE DELAY (for async flow)
// -------------------------------
function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
<script>
// -------------------------------------------------------
// MODULE 10 — FINAL GLUE + END OF FILE
// -------------------------------------------------------

// OPTIONAL: Auto‑clear result when typing
document.getElementById("returnIdInput").addEventListener("input", () => {
  clearResult();
});

// OPTIONAL: Press Enter to trigger prediction
document.getElementById("returnIdInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !document.getElementById("lookupBtn").disabled) {
    document.getElementById("lookupBtn").click();
  }
});
</script>
